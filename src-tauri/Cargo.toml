[package]
name = "claude-code-token-lens"
version = "1.0.0"
description = "Local-first token usage & cost dashboard for Claude Code"
authors = ["AIKnightPanda"]
license = "MIT"
repository = "https://github.com/AIKnightPanda/claude-code-token-lens"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
