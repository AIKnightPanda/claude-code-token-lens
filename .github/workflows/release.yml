name: Release

# 打 v* 标签就出安装包；也可以手动触发，只产出构建产物不建 Release。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 一个 universal 包同时覆盖 Apple Silicon 和 Intel，用户不用挑架构。
          - label: macOS (Apple Silicon + Intel)
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
          - label: Windows (x64)
            os: windows-latest
            rust-targets: ''
            args: ''

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      # Rust 依赖编译一次要好几分钟，缓存起来后续构建只花一分钟左右。
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS 签名 + 公证。这些 secret 没配时会自动跳过，构建仍然成功，
          # 只是产出的包未签名（用户首次打开要右键→打开）。
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          # 只有标签触发时才建 Release；手动触发时留空，仅上传构建产物。
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Claude Code Token Lens __VERSION__
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
          releaseBody: |
            ### 下载

            - **macOS**：`.dmg`（universal，Apple Silicon 与 Intel 通用）
            - **Windows**：`.exe`（NSIS 安装包）或 `.msi`

            ### 首次打开

            macOS 版已用 Developer ID 证书签名并经 Apple 公证，双击即可打开。
            Windows 版未签名，SmartScreen 弹窗里点「更多信息」→「仍要运行」即可。

            ### 说明

            应用只读取本机 `~/.claude/projects/` 下的日志，不联网、不上传任何数据。

      # 无论是否建 Release，都把安装包留一份，方便手动触发时下载验证。
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ runner.os }}
          if-no-files-found: warn
          path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.msi
